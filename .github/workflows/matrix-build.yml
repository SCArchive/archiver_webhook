name: Matrix Build with Cargo Cache

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            runs-on: ubuntu-latest
            container: debian:12
            target: x86_64-unknown-linux-gnu
          - name: Windows
            runs-on: windows-latest
            container: null
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build dependencies (Debian)
        if: matrix.container == 'debian:12'
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev ca-certificates

      - name: Install Rust (Debian)
        if: matrix.container == 'debian:12'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Setup Rust (Windows)
        if: matrix.runs-on == 'windows-latest'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          profile: minimal

      - name: Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      # Create an empty Cargo.lock file if it doesn't exist
      - name: Check for Cargo.lock
        shell: bash
        run: |
          if [ ! -f "Cargo.lock" ]; then
            echo "Creating empty Cargo.lock file"
            touch Cargo.lock
          fi

      - name: Build (Debian)
        if: matrix.container == 'debian:12'
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --target ${{ matrix.target }}

      - name: Run tests (Debian)
        if: matrix.container == 'debian:12'
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --target ${{ matrix.target }}

      - name: Build (Windows)
        if: matrix.runs-on == 'windows-latest'
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Run tests (Windows)
        if: matrix.runs-on == 'windows-latest'
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --target ${{ matrix.target }}

      - name: List built files
        shell: bash
        run: |
          if [ "${{ matrix.runs-on }}" == "windows-latest" ]; then
            dir target\\${{ matrix.target }}\\release
          else
            ls -la target/${{ matrix.target }}/release
          fi

      - name: Upload artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraper-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/archiver_webhook*
            !target/${{ matrix.target }}/release/archiver_webhook.d
          if-no-files-found: warn
          compression-level: 6
          retention-days: 5
      
      - name: Output artifact info
        if: steps.upload-artifact.outputs.artifact-id != ''
        run: |
          echo "Artifact ID: ${{ steps.upload-artifact.outputs.artifact-id }}"
          echo "Artifact URL: ${{ steps.upload-artifact.outputs.artifact-url }}" 